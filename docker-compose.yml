services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: remarket
      POSTGRES_USER: remarket
      POSTGRES_PASSWORD: remarket
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Storage/postgres/init_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Storage/postgres/open_food_facts_schema.sql:/docker-entrypoint-initdb.d/02_mapping.sql:ro
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      CATALOG_MONGO_USER: ${CATALOG_MONGO_USER}
      CATALOG_MONGO_PASSWORD: ${CATALOG_MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./Storage/mongodb/mongo_init.js:/docker-entrypoint-initdb.d/01-mongo-init.js:ro
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
  auth-service:
    build: ./Plateforme_API/auth-service
    environment: [DATABASE_URL=postgresql://remarket:remarket@postgres:5432/remarket, JWT_SECRET=change-me-in-production]
    ports: ["8081:8000"]
    depends_on: [postgres]
    labels: ["traefik.enable=true", "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)", "traefik.http.services.auth.loadbalancer.server.port=8000"]
  catalog-service:
    build: ./Plateforme_API/catalog-service
    environment:
      MONGO_URL: mongodb://${CATALOG_MONGO_USER}:${CATALOG_MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=${MONGO_DB}
      MONGO_DATABASE: ${MONGO_DB}
      MONGO_COLLECTION: catalog
    ports: ["8082:8000"]
    depends_on: [mongodb]
    labels: ["traefik.enable=true", "traefik.http.routers.catalog.rule=PathPrefix(`/graphql`)", "traefik.http.services.catalog.loadbalancer.server.port=8000"]
  inventory-service:
    build: ./Plateforme_API/inventory-service
    environment: [DATABASE_URL=postgresql://remarket:remarket@postgres:5432/remarket]
    ports: ["8083:8000"]
    depends_on: [postgres]
    labels: ["traefik.enable=true", "traefik.http.routers.inventory.rule=PathPrefix(`/api/inventory`)", "traefik.http.services.inventory.loadbalancer.server.port=8000"]
  order-service:
    build: ./Plateforme_API/order-service
    environment: [DATABASE_URL=postgresql://remarket:remarket@postgres:5432/remarket, INVENTORY_URL=http://inventory-service:8000, PAYMENT_URL=http://payment-service:8000]
    ports: ["8084:8000"]
    depends_on: [postgres, inventory-service, payment-service]
    labels: ["traefik.enable=true", "traefik.http.routers.orders.rule=PathPrefix(`/api/orders`)", "traefik.http.services.orders.loadbalancer.server.port=8000"]
  payment-service:
    build: ./Plateforme_API/payment-service
    environment: [DATABASE_URL=postgresql://remarket:remarket@postgres:5432/remarket]
    ports: ["8085:8000"]
    depends_on: [postgres]
    labels: ["traefik.enable=true", "traefik.http.routers.payment.rule=PathPrefix(`/api/payments`)", "traefik.http.services.payment.loadbalancer.server.port=8000"]
  traefik:
    image: traefik:v3.2
    command: --api.insecure=true --providers.docker=true --providers.docker.exposedbydefault=false --entrypoints.web.address=:80
    ports: ["80:80", "8080:80", "8088:8080"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    depends_on: [auth-service, catalog-service, inventory-service, order-service, payment-service]
  frontend:
    build: ./Frontend_web
    ports: ["3000:80"]
    depends_on: [traefik]
volumes:
  postgres-data:
  mongo-data:
